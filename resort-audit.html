<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resort Library — Audit</title>
<style>
  :root{--gold:#C9A84C;--espresso:#3A2E22;--cream:#FAF7F2;--line:#EAE5DC;
        --ok:#15803D;--miss:#B91C1C;--part:#B45309;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;margin:0;background:#fff;color:#2C2A26;line-height:1.5;}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 20px 90px;}
  h1{font-size:25px;margin:0 0 3px;font-weight:600;}
  h2{font-size:18px;margin:44px 0 3px;font-weight:600;padding-top:24px;border-top:1px solid var(--line);}
  .sub{color:#6B6459;font-size:13px;margin:0 0 20px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:16px;}
  .card{background:var(--cream);border-radius:8px;padding:13px;cursor:pointer;border:2px solid transparent;}
  .card:hover{border-color:var(--line);}
  .card.on{border-color:var(--gold);}
  .card b{display:block;font-size:23px;font-weight:600;}
  .card span{font-size:11.5px;color:#6B6459;}
  .bar{display:flex;gap:10px;align-items:center;margin:16px 0 12px;flex-wrap:wrap;}
  input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;font-size:14px;}
  button{background:var(--espresso);color:var(--gold);border:0;border-radius:7px;padding:9px 16px;font-size:11.5px;
    letter-spacing:1.4px;text-transform:uppercase;font-weight:600;cursor:pointer;}
  button.ghost{background:#fff;color:var(--espresso);border:1px solid var(--line);}
  table{border-collapse:collapse;font-size:13px;width:100%;}
  th{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:#8A8378;font-weight:600;
     padding:6px 2px;border-bottom:2px solid var(--line);vertical-align:bottom;text-align:center;}
  th.n,td.n{text-align:left;width:230px;padding-left:6px;}
  th.grp{border-bottom:0;color:var(--gold);font-size:9px;padding-bottom:2px;letter-spacing:1.2px;}
  td{border-bottom:1px solid var(--line);padding:7px 2px;text-align:center;white-space:nowrap;}
  td.n{font-weight:500;}
  .slug{font-weight:400;color:#A09789;font-size:10.5px;margin-top:1px;}
  a.open{color:#2C2A26;text-decoration:none;border-bottom:1px solid transparent;}
  a.open:hover{color:#8A6D3B;border-bottom-color:var(--gold);}
  .y{color:var(--ok);font-weight:600;}
  .n0{color:var(--miss);font-weight:700;}
  .p{color:var(--part);font-weight:600;font-size:11.5px;}
  .na{color:#C9C3B8;}
  tr:hover td{background:#FCFAF6;}
  .grpsep{border-left:1px solid var(--line);}
  .note{background:var(--cream);border-left:3px solid var(--gold);padding:12px 16px;font-size:13px;margin:18px 0;border-radius:0 6px 6px 0;}
  .legend{font-size:12px;color:#6B6459;margin:10px 0 0;}
  .legend span{margin-right:16px;}
  .loading{padding:60px 0;text-align:center;color:#8A8378;}
  .hidden{display:none;}
  .scroller{overflow-x:auto;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Resort Library — Audit</h1>
  <p class="sub" id="sub">Reading Firestore…</p>

  <div class="cards" id="cards"></div>

  <div class="bar">
    <input type="search" id="q" placeholder="Filter by resort name…">
    <button class="ghost" onclick="setFilter('all')">Show all</button>
    <button onclick="load()">Refresh</button>
  </div>

  <div class="note" id="buglist"></div>

  <p class="legend">
    <span><b class="y">&#10003;</b> complete</span>
    <span><b class="p">3/9</b> partial &mdash; hover to see exactly which are missing</span>
    <span><b class="n0">&#10007;</b> missing</span>
    <span><b class="na">&ndash;</b> not applicable</span>
  </p>

  <div class="scroller"><div id="out"><div class="loading">Loading…</div></div></div>

  <h2 id="orphanHead" class="hidden">Unreachable records</h2>
  <p class="sub hidden" id="orphanSub"></p>
  <div class="scroller"><div id="orphans"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:'AIzaSyAlYgdkcl7ZuRL2pXJ7BObGuQyxMdVH4Js',
  authDomain:'wedding-crm-e5d12.firebaseapp.com',
  projectId:'wedding-crm-e5d12',
  storageBucket:'wedding-crm-e5d12.firebasestorage.app',
  messagingSenderId:'246819649586',
  appId:'1:246819649586:web:a74debd217ce048d26242b'
});
const db=firebase.firestore();
const A=v=>Array.isArray(v)?v:[];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const LIBRARY_URL='resort-library.html';
let ROWS=[], FILTER='all';

// A wedding venue illustrated with a guest-room photo means the venue was
// invented from room data. Tokens are matched between separators so "ballroom"
// doesn't trip it — a ballroom IS a venue.
const ROOMPIC=/(?:^|[-_.\/ ])(JR[-_ ]?SU|MSTR|PRES|KING|DBL|QUEEN|RM|SUITE|BEDROOM)(?:$|[-_.\/ ])/i;
// A wedding package never costs "per person per night" — that's room data mis-filed.
const PER_NIGHT=/per\s*person\s*\/?\s*night|\/person\/night|per night/i;
const ROOMISH=/\b(suite|junior|master|presidential|king|queen|swim[- ]?up|swim[- ]?out|ocean\s*(front|view)|garden view|pool view|penthouse|villa|casita|bungalow)\b/i;
// Text that should never reach a client.
const LEAK=/⚠️|confirm with (the )?resort|verify current|not detailed in|not priced in|contact the resort wedding coordinator|listed on destinationweddings|DWT (site )?lists|SOURCE NOTE|pricing conflict|cancellation penalt|penalty fee|loyalty program|repeat stays|best-price guarantee/i;

// Amy's checklist, in order. `has` returns true / false / null(=not applicable),
// or [done,total] for "how many of them have it".
const CHECKS=[
 {g:'Core',   k:'tagline',  t:'Tagline',       f:d=>!!d.tagline},
 {g:'Core',   k:'desc',     t:'Description',   f:d=>!!d.description},
 {g:'Core',   k:'high',     t:'Highlights',    f:d=>!!(d.highlights&&String(d.highlights).trim())},
 {g:'Links',  k:'dwt',      t:'DWT',           f:d=>!!(d.dwtUrl||d.dwtLink)},
 {g:'Links',  k:'ct',       t:'CT',            f:d=>!!(d.ctUrl||d.ctLink)},
 {g:'Links',  k:'pkgurl',   t:'Pkg URL',       f:d=>!!(d.weddingUrl||d.weddingPackageUrl)},
 {g:'Club',   k:'club',     t:'Club info',     f:d=>{
    const nm=d.clubLevelName||d.clubName, pk=d.clubLevelPerks||d.clubPerks;
    if(!nm&&!pk) return null;            // no club level at this resort — not a gap
    return !!(nm&&pk);}},
 {g:'Rooms',  k:'rooms',    t:'Categories',    f:d=>A(d.roomCategories).length>0},
 {g:'Rooms',  k:'rmdesc',   t:'Descriptions',  f:d=>frac(d.roomCategories,'description')},
 {g:'Rooms',  k:'rmphoto', binary:true,  t:'Photos',        f:d=>frac(d.roomCategories,'photo')},
 {g:'Venues', k:'venues',   t:'Venues',        f:d=>A(d.venues).length>0},
 {g:'Venues', k:'vndesc',   t:'Descriptions',  f:d=>frac(d.venues,'description')},
 {g:'Venues', k:'vncap',    t:'Guest count',   f:d=>frac(d.venues,'capacity')},
 {g:'Venues', k:'vnphoto', binary:true,  t:'Photos',        f:d=>frac(d.venues,'photo')},
 {g:'Dining', k:'dining',   t:'Names',         f:d=>A(d.restaurants).length>0},
 {g:'Dining', k:'dndesc',   t:'Descriptions',  f:d=>frac(d.restaurants,'description')},
 {g:'Dining', k:'dnphoto', binary:true,  t:'Photos',        f:d=>frac(d.restaurants,'photo')},
 {g:'Packages',k:'pkgs',    t:'Names',         f:d=>A(d.packages).length>0},
 {g:'Packages',k:'pkgprice',t:'Price',         f:d=>frac(d.packages,'price')},
 {g:'Packages',k:'pkgsum',  t:'Summary',       f:d=>frac(d.packages,'summary')},
 {g:'Photos', k:'aerial',   t:'Aerial',        f:d=>d._aerial>0},
 {g:'Photos', k:'gallery',  t:'Resort photos', f:d=>A(d.photos).length>0 || d._uploaded>0}
];
function frac(arr,field){
  const a=A(arr); if(!a.length) return [0,0,[]];
  const missing=a.filter(x=>!(x&&String(x[field]||'').trim()))
                 .map(x=>(x&&x.name)||'(unnamed)');
  return [a.length-missing.length, a.length, missing];
}

function cell(v, check){
  if(v===null) return '<span class="na" title="No club level at this resort">&ndash;</span>';
  if(Array.isArray(v)){
    const [d,t,missing]=v;
    if(t===0)  return '<span class="n0">&#10007;</span>';
    if(d===t)  return '<span class="y">&#10003;</span>';
    // Photos are pass/fail: if any are missing the section needs work, and the
    // count doesn't change what you do about it. Hover still names them.
    if(check && check.binary){
      const names=(missing||[]).slice(0,12).join('\n');
      const more=(missing||[]).length>12 ? '\n…and '+((missing.length)-12)+' more' : '';
      return '<span class="n0" title="Missing photos:\n'+
        esc(names+more).replace(/"/g,'&quot;')+'">&#10007;</span>';
    }
    const names=(missing||[]).slice(0,12).join('\n');
    const more=(missing||[]).length>12 ? '\n…and '+((missing.length)-12)+' more' : '';
    return '<span class="p" title="Missing ('+(t-d)+' of '+t+'):\n'+
      esc(names+more).replace(/"/g,'&quot;')+'">'+d+'/'+t+'</span>';
  }
  return v ? '<span class="y">&#10003;</span>' : '<span class="n0">&#10007;</span>';
}
// A row counts as complete when nothing is missing or partial.
function gapsOf(d){
  return CHECKS.filter(c=>{
    const v=c.f(d);
    if(v===null) return false;
    if(Array.isArray(v)) return v[1]===0 || v[0]<v[1];
    return !v;
  }).length;
}
function dataBugs(d){
  const out=[];
  const bad=A(d.packages).filter(p=>PER_NIGHT.test(p.price||'')||ROOMISH.test(p.name||''));
  if(bad.length) out.push('rooms filed as packages ('+bad.length+')');
  const rp=A(d.venues).filter(v=>v.photo&&ROOMPIC.test(v.photo.split('/').pop()||''));
  if(rp.length) out.push(rp.length===A(d.venues).length
      ? 'venues look fabricated — all '+rp.length+' use room photos'
      : rp.length+' venue photos are guest-room images');
  let leaks=0;
  ['packages','venues','roomCategories','restaurants'].forEach(k=>A(d[k]).forEach(x=>{
    if(LEAK.test((x.highlights||'')+' '+(x.description||'')+' '+(x.price||'')))leaks++;}));
  if(LEAK.test(d.packageNotes||'')) leaks++;
  if(leaks) out.push('client-facing text problem ('+leaks+')');
  return out;
}

async function load(){
  document.getElementById('out').innerHTML='<div class="loading">Loading…</div>';
  const [snap,rpSnap]=await Promise.all([
    db.collection('resortProfiles').get(),
    db.collection('resortPhotos').get()
  ]);
  // Photos live in two places: a list on the profile, and the uploads collection.
  // Count both, otherwise resorts with 100+ uploads look empty.
  const uploaded={}, aerial={};
  rpSnap.docs.forEach(p=>{const v=p.data(); const s=v.resortSlug||v.resort; if(!s) return;
    uploaded[s]=(uploaded[s]||0)+1;
    if(/aerial/i.test(v.category||'')) aerial[s]=(aerial[s]||0)+1;});

  const docs={}; snap.docs.forEach(d=>{
    const x=d.data(); x._uploaded=uploaded[d.id]||0; x._aerial=aerial[d.id]||0; docs[d.id]=x;});

  let opts=[];
  try{
    const html=await (await fetch(LIBRARY_URL+'?cb='+Date.now())).text();
    const sel=new DOMParser().parseFromString(html,'text/html').getElementById('masterResort');
    opts=[...sel.options].filter(o=>o.value&&o.value!=='other')
      .map(o=>({slug:o.value,label:o.textContent.trim()}));
  }catch(e){ opts=[]; }
  // Union with the database, so a resort either of them creates shows up here
  // straight away — no waiting for the library file to be pushed.
  const listed=new Set(opts.map(o=>o.slug));
  Object.keys(docs).forEach(k=>{
    if(listed.has(k)) return;
    const x=docs[k];
    const n=['roomCategories','restaurants','venues','packages'].reduce((a,f)=>a+A(x[f]).length,0);
    if(!n && !x.tagline && !x.description) return;   // skip empty shells
    opts.push({slug:k,label:x.resortName||x.name||k});
  });
  opts.sort((a,b)=>a.label.localeCompare(b.label));

  ROWS=opts.map(o=>{
    const d=docs[o.slug];
    return {...o, d, gaps:d?gapsOf(d):CHECKS.length, bugs:d?dataBugs(d):[]};
  });

  const done   = ROWS.filter(r=>r.d&&r.gaps===0).length;
  const bugs   = ROWS.filter(r=>r.bugs.length).length;
  const norec  = ROWS.filter(r=>!r.d).length;
  const empty  = ROWS.filter(r=>r.d&&!A(r.d.roomCategories).length&&!A(r.d.restaurants).length
                    &&!A(r.d.venues).length&&!A(r.d.packages).length).length;
  const partial= ROWS.length-done-norec-empty;

  document.getElementById('sub').textContent =
    ROWS.length+' resorts · '+CHECKS.length+' checks each · refreshed '+new Date().toLocaleString();

  document.getElementById('cards').innerHTML=[
    ['bugs',bugs,'Data bugs'],['partial',partial,'Partial'],
    ['empty',empty,'Empty record'],['norec',norec,'No record'],['done',done,'Complete']
  ].map(([k,v,l])=>'<div class="card'+(FILTER===k?' on':'')+'" onclick="setFilter(\''+k+'\')"><b>'+v+
    '</b><span>'+l+'</span></div>').join('');

  const bl=ROWS.filter(r=>r.bugs.length);
  document.getElementById('buglist').innerHTML = bl.length
    ? '<b>Fix these first.</b> They produce visibly wrong quotes: '+
      bl.map(r=>esc(r.label)+' <i>('+r.bugs.join('; ')+')</i>').join(' &middot; ')
    : '<b>No data bugs.</b> Nothing is mis-filed or leaking internal notes into client-facing text.';

  renderOrphans(docs, new Set(opts.map(o=>o.slug)));
  render();
}
function setFilter(f){ FILTER=(FILTER===f?'all':f); load(); }

function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  let rows=ROWS.filter(r=>!q||r.label.toLowerCase().includes(q)||r.slug.includes(q));
  if(FILTER==='bugs')   rows=rows.filter(r=>r.bugs.length);
  if(FILTER==='done')   rows=rows.filter(r=>r.d&&r.gaps===0);
  if(FILTER==='norec')  rows=rows.filter(r=>!r.d);
  if(FILTER==='empty')  rows=rows.filter(r=>r.d&&!A(r.d.roomCategories).length&&!A(r.d.restaurants).length&&!A(r.d.venues).length&&!A(r.d.packages).length);
  if(FILTER==='partial')rows=rows.filter(r=>r.d&&r.gaps>0&&!(!A(r.d.roomCategories).length&&!A(r.d.restaurants).length&&!A(r.d.venues).length&&!A(r.d.packages).length));
  rows.sort((a,b)=>(b.bugs.length-a.bugs.length)||(b.gaps-a.gaps)||a.label.localeCompare(b.label));

  // grouped header
  let g1='<tr><th class="n"></th>', g2='<tr><th class="n">Resort</th>', last=null;
  CHECKS.forEach(c=>{
    const sep = c.g!==last ? ' grpsep' : '';
    g1+='<th class="grp'+sep+'">'+(c.g!==last?esc(c.g):'')+'</th>';
    g2+='<th class="'+sep.trim()+'">'+esc(c.t)+'</th>';
    last=c.g;
  });
  g1+='</tr>'; g2+='</tr>';

  document.getElementById('out').innerHTML = rows.length===0
    ? '<div class="loading">Nothing matches.</div>'
    : '<table>'+g1+g2+rows.map(r=>{
        let tds='<td class="n"><a class="open" target="_blank" href="resort-library.html?resort='+
          encodeURIComponent(r.slug)+'">'+esc(r.label)+'</a><div class="slug">'+esc(r.slug)+'</div></td>';
        let last2=null;
        CHECKS.forEach(c=>{
          const sep=c.g!==last2?' class="grpsep"':''; last2=c.g;
          tds+='<td'+sep+'>'+(r.d?cell(c.f(r.d),c):'<span class="n0">&#10007;</span>')+'</td>';
        });
        return '<tr>'+tds+'</tr>';
      }).join('')+'</table>';
}

function renderOrphans(docs, inDrop){
  const norm=s=>s.replace(/[^a-z]/g,'');
  const drop=[...inDrop];
  const orph=Object.keys(docs).filter(id=>!inDrop.has(id)).map(id=>{
    const x=docs[id];
    const n=A(x.roomCategories).length+A(x.restaurants).length+A(x.venues).length+A(x.packages).length;
    const match=drop.filter(d=>norm(d).includes(norm(id).slice(0,14))||norm(id).includes(norm(d).slice(0,14)));
    return {id,n,match,name:x.resortName||x.name||''};
  }).filter(o=>o.n>0).sort((a,b)=>b.n-a.n);
  const H=document.getElementById('orphanHead'), S=document.getElementById('orphanSub');
  if(!orph.length){ H.className='hidden'; S.className='sub hidden'; document.getElementById('orphans').innerHTML=''; return; }
  H.className=''; S.className='sub';
  S.textContent=orph.length+' records hold data but no dropdown option points at them — '+
    orph.reduce((a,b)=>a+b.n,0)+' items the library cannot open.';
  document.getElementById('orphans').innerHTML='<table><tr><th class="n">Orphan record</th><th>Items</th><th class="n">Likely belongs to</th></tr>'+
    orph.map(o=>'<tr><td class="n">'+esc(o.name||o.id)+'<div class="slug">'+esc(o.id)+'</div></td><td>'+o.n+
      '</td><td class="n">'+(o.match.length?o.match.map(esc).join(', ')
        :'<span class="n0">not in dropdown at all</span>')+'</td></tr>').join('')+'</table>';
}

document.getElementById('q').addEventListener('input',render);
load();
</script>
</body>
</html>
